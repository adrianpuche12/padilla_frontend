name: Deploy — DEV

on:
  push:
    branches:
      - dev

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/adrianpuche-padilla-frontend

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push imagen :dev
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=http://100.84.196.79:9280
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:dev-${{ github.sha }}

      - name: Deploy en servidor DEV
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}:dev

            if docker service ls | grep -q padilla-frontend-dev; then
              docker service update \
                --image ${{ env.IMAGE }}:dev \
                --with-registry-auth \
                padilla-frontend-dev
            else
              docker service create \
                --name padilla-frontend-dev \
                --network padilla-network-dev \
                --publish 9282:80 \
                --with-registry-auth \
                ${{ env.IMAGE }}:dev
            fi
